source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono NFM SemiBold

# GENERAL
general {
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = /home/qasim/wallpapers/pixel.png
    blur_passes = 0
    blur_size = 7
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(000000)
    font_size = 180
    font_family = $font
    position = 0, -100
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = rgb(000000)
    font_size = 30
    font_family = $font
    position = 0, -380
    halign = center
    valign = top
}

# FINGERPRINT
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(000000)
    font_size = 14
    font_family = $font
    position = 0, -107
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    size = 600, 100
    outline_thickness = 4
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $mantle
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha"><i>Password</i></span>
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, 0
    halign = center
    valign = center
}
